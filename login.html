<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Login | Sports Tournament Management</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/bluewake-logo.svg">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-deep">
    <div class="position-fixed top-0 end-0 p-3 z-3 d-flex gap-2 align-items-center">
        <button class="theme-toggle btn btn-link p-0"><i class="bi bi-moon-stars fs-5"></i></button>
        <button class="rtl-toggle btn btn-outline-light btn-sm px-2 py-1" style="font-size: 0.75rem;">RTL</button>
    </div>
    <!-- Login Section -->
    <section class="section-padding min-vh-100 d-flex align-items-center position-relative overflow-hidden">
        <img src="assets/images/hero_tournament_game.jpg" alt="Tournament Auth" class="hero-video-bg">
        <div class="hero-overlay" style="opacity: 0.5;"></div>

        <!-- Ambient Background Element -->
        <div class="position-absolute top-50 start-50 translate-middle"
            style="width: 600px; height: 600px; background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%); z-index: 0;">
        </div>

        <div class="container-custom z-1">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="glass-panel p-5 border-accent shadow-lg reveal">
                        <div class="text-center mb-5">
                            <a href="index.html"
                                class="text-decoration-none d-inline-flex align-items-center gap-2 mb-3">
                                <img src="assets/images/bluewake-logo.svg" alt="Sports Tournament Management logo"
                                    class="brand-logo auth-brand-logo">
                                <span class="fs-3 fw-bold text-gradient">TOURNAPRO</span>
                            </a>
                            <h5 class="text-accent font-monospace mb-2">ORGANIZER & CAPTAIN PORTAL</h5>
                            <h3 class="display-6 fw-bold">Sign <span class="text-accent">In.</span></h3>
                            <p class="text-muted mt-3">Welcome back to your tournament management console.</p>
                        </div>

                        <form class="row g-4">
                            <div class="col-12">
                                <label class="form-label small text-muted text-uppercase tracking-widest">Email
                                    Address</label>
                                <div class="position-relative">
                                    <i
                                        class="bi bi-envelope position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
                                    <input type="email"
                                        class="form-control bg-transparent border-secondary ps-5 py-3 text-white"
                                        placeholder="name@example.com">
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label
                                        class="form-label small text-muted text-uppercase tracking-widest">Password</label>
                                </div>
                                <div class="position-relative">
                                    <i
                                        class="bi bi-shield-lock position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
                                    <input type="password"
                                        class="form-control bg-transparent border-secondary ps-5 py-3 text-white password-input"
                                        placeholder="••••••••">
                                    <i class="bi bi-eye toggle-password position-absolute end-0 top-50 translate-middle-y me-3 text-muted"
                                        style="cursor: pointer;"></i>
                                </div>
                            </div>

                            <div class="col-12 d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
                                <div class="form-check mb-0">
                                    <input class="form-check-input bg-transparent border-secondary" type="checkbox"
                                        id="rememberMe">
                                    <label class="form-check-label small text-muted text-uppercase" for="rememberMe"
                                        style="cursor: pointer;">
                                        Remember Me
                                    </label>
                                </div>
                                <a href="#" class="small text-accent text-decoration-none">Forgot Password?</a>
                            </div>

                            <div class="col-12 mt-4">
                                <button type="button" class="btn-marine w-100 py-3 mb-4">Access Tournament Console</button>

                                <div class="text-center mb-3">
                                    <span class="small text-muted text-uppercase tracking-widest">Or continue
                                        with</span>
                                </div>
                                <div class="d-grid gap-2 mb-4">
                                    <button type="button" class="btn btn-outline-light py-2"><i
                                            class="bi bi-google me-2"></i>Continue with Google</button>
                                    <button type="button" class="btn btn-outline-light py-2"><i
                                            class="bi bi-facebook me-2"></i>Continue with Facebook</button>
                                </div>

                                <div class="text-center">
                                    <p class="text-muted small mb-0">Don't have an account? <a href="signup.html"
                                            class="text-accent text-decoration-none fw-bold ms-1">Create Account</a></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
